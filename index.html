<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro Salem</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f0ea;
      color: #252525;
    }

    header {
      background: #633176;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 32px auto;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h2 {
      margin-bottom: 6px;
    }

    .intro p {
      margin-top: 0;
      color: #666;
    }

    .strumenti {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      display: block;
      padding: 22px;
      background: white;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
    }

    .card h3 {
      margin: 0 0 8px;
      color: #633176;
    }

    .card p {
      margin: 0;
      color: #666;
      line-height: 1.4;
    }

    .non-disponibile {
      opacity: 0.55;
      cursor: default;
    }

    @media (max-width: 600px) {
      header {
        padding: 25px 16px;
      }

      header h1 {
        font-size: 27px;
      }

      main {
        margin-top: 22px;
      }

      .strumenti {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Registro Salem</h1>
    <p>Portale gestionale della Salem Auror Academy</p>
  </header>

  <main>

    <section class="intro">
      <h2>Strumenti</h2>
      <p>Seleziona lo strumento che vuoi utilizzare.</p>
    </section>

    <section class="strumenti">

      <a class="card non-disponibile" href="#">
        <h3>Registro Voti</h3>
        <p>Gestione dei voti e dei punteggi degli studenti.</p>
      </a>

      <a class="card non-disponibile" href="#">
        <h3>Contest</h3>
        <p>Gestione dei contest e dei relativi punteggi.</p>
      </a>

      <a class="card non-disponibile" href="#">
        <h3>Boccino</h3>
        <p>Gestione del gioco del Boccino.</p>
      </a>

    </section>

  </main>

</body>
</html>
